name: MemGate CI (Strict Privacy Protocol)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: 🛡️ Privacy Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest colorama

    - name: 🧪 Run Strict Privacy Test Suite
      run: |
        pytest memgate/tests/test_scenarios.py memgate/tests/test_knowledge_store.py memgate/tests/test_privacy_review.py -v
