name: MemGate CI (Strict Privacy Protocol)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: 🛡️ Privacy Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest colorama

    - name: 🧪 Run Strict Privacy Test Suite
      run: |
        pytest memgate/tests/test_scenarios.py memgate/tests/test_knowledge_store.py memgate/tests/test_privacy_review.py memgate/tests/test_providers.py -v
