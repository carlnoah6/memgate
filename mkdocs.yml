site_name: MemGate
site_description: Privacy-Aware Memory Isolation Layer for AI Agents
site_url: https://carlnoah6.github.io/memgate/
repo_url: https://github.com/carlnoah6/memgate
repo_name: carlnoah6/memgate

theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

nav:
  - Home: index.md
  - API Reference:
      - Privacy Reviewer: reference/privacy_review.md
      - Knowledge Store: reference/knowledge_store.md
      - Context Engine: reference/context.md
  - Red Team: reference/red_team.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
