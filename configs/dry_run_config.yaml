# =============================================================================
# Dry Run Configuration — Integration Test
# =============================================================================

# --- Model (Tiny for fast test) ---
model:
  dim: 256
  n_layers: 2
  n_heads: 4
  n_kv_heads: 2
  vocab_size: 1024
  multiple_of: 32
  ffn_dim_multiplier: null
  norm_eps: 0.00001
  max_seq_len: 128
  rope_theta: 10000.0
  use_bias: false

# --- Training (Short duration) ---
training:
  # Optimization
  lr: 0.0003
  min_lr: 0.00003
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip_max_norm: 1.0

  # Batch sizing
  micro_batch_size: 2
  gradient_accumulation_steps: 1

  # Schedule
  max_steps: 10          # Only run 10 steps
  warmup_steps: 2

  # Mixed precision
  dtype: fp32            # Use fp32 for safety on all hardware (or bf16 if supported)

  # Checkpointing
  checkpoint_dir: checkpoints/dry_run
  checkpoint_interval: 5
  resume_from: null

  # Evaluation
  eval_interval: 5
  eval_steps: 1

  # Logging
  log_interval: 1
  wandb_project: null

  # Reproducibility
  seed: 42

# --- Data ---
data:
  train_path: null # Uses synthetic data in launch.py
  val_path: null
  seq_len: 128
  num_workers: 0

# --- Distributed ---
distributed:
  backend: gloo # Use gloo for CPU/single-node compatibility if needed, or nccl if GPU
  fsdp:
    enabled: false # Disable FSDP for simple dry run integration test on single device first
    sharding_strategy: NO_SHARD
    mixed_precision: false
    activation_checkpointing: false
    cpu_offload: false
