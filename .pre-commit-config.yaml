repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  - repo: local
    hooks:
      - id: privacy-words
        name: 🔒 Privacy Word Scan
        entry: python3 scripts/check-privacy-words.py
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest-check
        name: Run Pytest
        entry: pytest
        language: system
        pass_filenames: false
        types: [python]
        stages: [pre-push]
