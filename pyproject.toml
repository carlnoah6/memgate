[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memgate"
version = "0.3.1"
description = "Privacy-aware memory isolation for AI agents"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
  {name = "MemGate Contributors"},
]
dependencies = [
  "colorama>=0.4.6",
]

[project.scripts]
memgate = "memgate.cli:main"
privacy-check = "memgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["memgate"]

[tool.hatch.build.targets.sdist]
include = [
  "/memgate",
  "/scripts",
]
