[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memgate"
version = "0.3.0"
description = "Privacy-aware memory isolation layer for AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "MemGate Contributors"},
]
keywords = ["ai", "agent", "privacy", "memory", "isolation", "llm", "guardrail"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pre-commit>=3.0",
  "ruff>=0.1.0",
  "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/carlnoah6/memgate"
Repository = "https://github.com/carlnoah6/memgate"
Issues = "https://github.com/carlnoah6/memgate/issues"
Documentation = "https://github.com/carlnoah6/memgate#readme"

[project.scripts]
memgate = "memgate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["memgate"]

[tool.hatch.build.targets.sdist]
include = [
  "memgate/",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = [
  "memgate/**/__pycache__",
  "memgate/.pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["memgate/tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
